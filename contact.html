<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation | Contact</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff7f7;
            color: #333333;
            line-height: 1.6;
        }

        header {
            background-color: #a61b29;
            color: white;
            text-align: center;
            padding: 24px 12px;
        }

        header h1 { margin: 0; }

        nav {
            background-color: #7f1420;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 14px;
            font-weight: bold;
        }

        nav a:hover, nav a[aria-current="page"] { text-decoration: underline; }

        main {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            background-color: white;
            border-left: 6px solid #c62838;
            padding: 22px;
            border-radius: 6px;
        }

        form {
            background-color: white;
            padding: 22px;
            border-radius: 6px;
        }

        label { display: block; margin-top: 12px; font-weight: bold; }

        input, textarea {
            width: 100%;
            padding: 9px;
            margin-top: 4px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-family: inherit;
        }

        button {
            margin-top: 16px;
            background-color: #c62838;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover { background-color: #941b29; }

        footer {
            background-color: #eeeeee;
            text-align: center;
            padding: 14px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Blood Donation</h1>
        <p>A small act can make a big difference</p>
    </header>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="eligibility.html">Eligibility</a>
        <a href="donate.html">How to Donate</a>
        <a href="contact.html" aria-current="page">Contact</a>
    </nav>

    <main>
        <section class="welcome">
            <h2>Contact Us</h2>
            <p>Email: blooddonation862@gmail.com</p>
            <p>Phone: +91 9898218360</p>
            <p>Phone: +91 7984882626</p>
        </section>

        <section>
            <h2>Send a Message</h2>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" required>

                <label for="message">Message</label>
                <textarea id="message" rows="5" required></textarea>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Blood Donation. All rights reserved.</p>
    </footer>

</body>
</html>
